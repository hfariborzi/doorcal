<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Midore</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body { background: var(--board); overflow: hidden; }
    body { display: flex; flex-direction: column; height: 100vh; font-size: 13px; border: 1px solid var(--line); user-select: none; -webkit-user-select: none; cursor: default; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }

    header { display: flex; align-items: center; gap: 4px; padding: 12px 12px 6px 14px; }
    header h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; margin-right: auto; }
    .nav { width: 26px; height: 26px; border-radius: 6px; color: var(--muted); font-size: 16px; line-height: 1; }
    .nav:hover, .today-btn:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); }
    .today-btn { height: 26px; padding: 0 8px; border-radius: 6px; color: var(--muted); font-weight: 600; }

    .month { display: grid; grid-template-columns: repeat(7, 1fr); padding: 0 10px 8px; row-gap: 1px; }
    .wd { text-align: center; font-size: 10.5px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: 0.04em; padding: 2px 0 4px; }
    .day { position: relative; height: 30px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
    .day span { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; transition: background-color 120ms ease; }
    .day:hover span { background: color-mix(in srgb, var(--ink) 7%, transparent); }
    .day.out { color: var(--faint); opacity: 0.55; }
    .day.today span { color: var(--work); font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--work); }
    .day.sel span { background: var(--ink); color: var(--board); font-weight: 600; box-shadow: none; }
    .day.sel.today span { background: var(--work); color: #fff; }

    .dayhead { display: flex; align-items: baseline; gap: 8px; padding: 10px 14px 6px; border-top: 1px solid var(--line); }
    .dayhead h2 { font-size: 13px; font-weight: 700; }
    .dayhead .faint { font-size: 12px; margin-left: auto; }

    .notice { margin: 2px 12px 6px; padding: 6px 9px; border-radius: 6px; font-size: 12px; text-align: left; width: calc(100% - 24px); background: color-mix(in srgb, var(--work) 10%, var(--surface)); box-shadow: inset 3px 0 0 var(--work); }

    .list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
    .empty { padding: 22px 8px; text-align: center; color: var(--faint); }
    .item { display: grid; grid-template-columns: 58px 1fr auto; align-items: center; gap: 8px; min-height: 34px; padding: 4px 6px; border-radius: 6px; }
    .item:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); }
    .time { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.25; }
    .time small { display: block; color: var(--faint); font-size: 10.5px; }
    .title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
    /* Events get the category colour as a bar on the left, tasks as a line underneath (as on the web calendar). */
    .item.event .title { padding-left: 8px; box-shadow: inset 3px 0 0 var(--c); }
    .item.task .title { text-decoration: underline; text-decoration-color: var(--c); text-decoration-thickness: 2px; text-underline-offset: 4px; }
    .item.done .title { text-decoration-line: line-through; color: var(--faint); }
    .item.missed .title { color: var(--muted); }
    .item.now { background: color-mix(in srgb, var(--c) 12%, transparent); }
    .tag { font-size: 10.5px; font-weight: 600; color: var(--muted); }
    .tag.now { color: var(--work); }
    .tick { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--c) 70%, var(--line)); display: grid; place-items: center; transition: background-color 120ms ease, transform 120ms ease-out; }
    .tick:hover { background: color-mix(in srgb, var(--c) 18%, transparent); }
    .tick:active { transform: scale(0.92); }
    .tick.on { background: var(--c); border-color: var(--c); color: #fff; font-size: 11px; }
    .join { height: 22px; padding: 0 8px; border-radius: 5px; font-size: 11.5px; font-weight: 600; color: #fff; background: var(--work); }
    .join:hover { background: var(--work-hover); }
    .allday { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 6px 6px; }
    .allday span { padding: 2px 7px; border-radius: 4px; font-size: 11.5px; font-weight: 500; background: color-mix(in srgb, var(--c) 16%, var(--surface)); box-shadow: inset 3px 0 0 var(--c); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    footer { display: flex; gap: 6px; padding: 8px 10px 10px; border-top: 1px solid var(--line); }
    footer input { flex: 1; min-width: 0; height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--ink); font: inherit; }
    footer input::placeholder { color: var(--faint); }
    .open { height: 30px; padding: 0 10px; border-radius: 7px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
    .open:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 5%, transparent); }
    .msg { padding: 0 12px 6px; font-size: 12px; }
    .skeleton { height: 28px; margin: 6px 6px; border-radius: 6px; background: color-mix(in srgb, var(--ink) 6%, transparent); }
  </style>
</head>
<body>
  <header>
    <h1 id="month"></h1>
    <button class="today-btn" id="today" type="button">Today</button>
    <button class="nav" id="prev" type="button" aria-label="Previous month">‹</button>
    <button class="nav" id="next" type="button" aria-label="Next month">›</button>
  </header>
  <div class="month" id="grid" role="grid" aria-label="Month"></div>
  <div class="dayhead"><h2 id="dayname"></h2><span class="faint" id="count"></span></div>
  <button class="notice" id="problems" type="button" hidden></button>
  <div class="list" id="list" aria-live="polite"></div>
  <p class="msg error" id="error" role="alert" hidden></p>
  <footer>
    <form id="add" autocomplete="off" style="display:contents">
      <input id="text" placeholder="Add a task…" aria-label="Add a task" />
    </form>
    <button class="open" id="openMain" type="button">Open Midore</button>
  </footer>
  <script src="mini.js"></script>
</body>
</html>
