# The Mac widget extension, built separately and copied into Midore.app/Contents/PlugIns by
# native/scripts/before-bundle.mjs (Tauri does not make an Xcode project for macOS). The iPhone widget is a
# target inside Tauri's own iOS project instead (see native/scripts/ios-widget.mjs).
name: MidoreWidgetsMac
options:
  bundleIdPrefix: app.midore
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: 9437GLFKZ8
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  MidoreWidgets:
    type: app-extension
    platform: macOS
    sources:
      - Shared
      - Widgets
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Midore
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: macOS/MidoreWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - 9437GLFKZ8.app.midore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.midore.widgets
        PRODUCT_NAME: MidoreWidgets
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        SKIP_INSTALL: YES
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: NO
